; OutfallWatch ESP32-S3 firmware.
; NOTE: Written against the Arduino-ESP32 core for a generic ESP32-S3 DevKit.
; Verify the EXACT Freenove board variant and adjust `board` + GPIOs (see
; docs/FREENOVE_INTEGRATION.md) before flashing. NOT flash-verified in the build env.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    milesburton/DallasTemperature @ ^3.11.0
    paulstoffregen/OneWire @ ^2.3.8
build_flags =
    -DCORE_DEBUG_LEVEL=1
