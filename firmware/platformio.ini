; OutfallWatch ESP32-S3 firmware.
; Arduino-ESP32 core, generic ESP32-S3 DevKit target.
; Flash-verified 2026-10-09 on a real Freenove ESP32-S3-WROOM (CAM variant): this `board`
; value uploads and boots correctly on that hardware. Sensor/indicator wiring on the GPIOs
; below is still unverified — see docs/FREENOVE_INTEGRATION.md.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Freenove CAM board has two USB-C ports; pin the CH343 UART bridge (VID 1A86:55D3)
; so auto-detect can't pick Bluetooth/audio serial devices. Glob survives replug.
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    milesburton/DallasTemperature @ ^3.11.0
    paulstoffregen/OneWire @ ^2.3.8
build_flags =
    -DCORE_DEBUG_LEVEL=1
